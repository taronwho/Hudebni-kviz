[build]
  # Netlify nic nesestavuje: index.html, app.js a app.css jsou už sestavené v repozitáři (viz tools/build.js)
  publish = "."
  # Šetření limitu Netlify: stavět jen produkci (main), náhledy PR a jiné větve přeskočit
  ignore = "if [ \"$CONTEXT\" = \"production\" ]; then exit 1; else exit 0; fi"

# Tyto soubory se nesmí držet ve staré verzi, aby se aktualizace projevily hned
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "no-cache"
