[build]
  publish = "."
  # Šetření limitu Netlify: stavět jen produkci (main), náhledy PR a jiné větve přeskočit
  ignore = "if [ \"$CONTEXT\" = \"production\" ]; then exit 1; else exit 0; fi"

# Service worker a manifest se nesmí cachovat, aby se aktualizace projevily hned
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

